[project]
name = "fruitfly-calculator"
version = "1.0.0"
description = "Male Drosophila CNS connectome as a spiking simulation on a TI-Nspire CX II"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "numba", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests on synthetic data",
    "integration: needs the built host binaries",
    "connectome: needs the downloaded male CNS data and build/calc output",
]

[tool.ruff]
line-length = 120
exclude = ["vendor", "scratch", "build", "data"]

[tool.black]
line-length = 120
